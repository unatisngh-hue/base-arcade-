:root{
  /* ---- palette (single source of truth) ---- */
  /* every hex below is pulled literally from figma-refs/nav-1..6.svg + button.svg */
  --bg-top:#21427C;
  --bg-mid:#557EB7;
  --bg-bot:#60A5FA;
  --title-fill:#A5C5EF;     /* title letters — flat fill per nav SVGs        */
  --title-outline:#0F172A;  /* title letter outline                          */
  --title-shadow:#00233D;   /* hard 2px offset shadow                        */
  --title-font:'LomoWebPixelLTStd-5','Press Start 2P',ui-monospace,monospace;
  --stat:#60A5FA;           /* COINS / SCORE / TIME text                     */
  --btn-face:#A5C5EF;       /* button.svg face                               */
  --btn-edge:#1E3445;       /* button.svg outline + hard shadow              */
  --btn-text:#1E3445;
  --pill-face:#A5C5EF;      /* PAUSE / CONTINUE pill face                    */
  --pill-outline:#203B51;   /* pill outline                                  */
  --pill-shade:#62819B;     /* pill inner bottom shadow                      */
  --gear:#CDCDCD;
  --gear-edge:#00233D;
  --opt-face:#D5E5FF;       /* settings option, resting (white)              */
  --opt-face-sel:#2760C4;   /* settings option, chosen (blue)                */
  --opt-shade-sel:#1B4488;  /* chosen option, inner shading                  */
  --opt-text-sel:#EEEFF1;
  --panel-bg:#1B2C4B;       /* settings popup panel                          */
  --panel-edge:#0062CC;     /* settings popup pixel border                   */
  --close-face:#FF4545;     /* red X close button                            */
  --close-mark:#2E2626;
  --label-band:#2E62B9;     /* game-name band inside the screen              */
  --label-text:#A5C5EF;
  --pix-frame:#D7E8FF;      /* white pixel border around the screen          */
  --arrow-next:#EEEFF1;     /* carousel: white = next                        */
  --arrow-prev:#2760C4;     /* carousel: blue = previous                     */
  --board-bg:#0F172A;
  --board-edge:#2760C4;
  --grid:#2E4E82;
  --block:#244B8B;      /* brick fill from the nav previews  */
  --block-hi:#60A5FA;   /* brick outline                     */
  --dim:#24406e;
  --white:#ffffff;
  --orange:#f5a623;
  --yellow:#FBBF24;
  --dpad-bg:#162655;        /* console controls disc                         */
  --dpad-edge:#2760C4;
  --dpad-arrow:#2760C4;

  /* two-step pixel staircase corner, used by every button (matches the
     provided button.svg exactly: two 1-step stairs per corner, not a
     single diagonal notch) */
  --n:3px;
  --pc:polygon(
    calc(var(--n)*2) 0, calc(100% - var(--n)*2) 0,
    calc(100% - var(--n)*2) var(--n), calc(100% - var(--n)) var(--n),

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg-top);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 39%,var(--bg-bot) 100%);
  font-family:var(--title-font);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100%;overflow-x:hidden;
}
#phone{
  width:100%;max-width:393px;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;
  padding:26px 11px 18px;position:relative;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 39%,var(--bg-bot) 100%);
}

/* ---------- header (geometry + colours from nav 1-6.svg) ---------- */
#title{
  font-family:var(--title-font);
  /* sized to the nav SVGs: the wordmark spans x65.7-327.7 (262px wide)
     on the 393 canvas — it was rendering at 174px, about two-thirds size */
  font-size:33px;letter-spacing:1.5px;font-weight:400;
  color:var(--title-fill);
  -webkit-text-stroke:0.9px var(--title-outline);
  text-shadow:3px 3px 0 var(--title-shadow);
  text-align:center;line-height:1.4;cursor:pointer;user-select:none;
}
/* HUD row — aligned to the same margins as the PAUSE→gear row (x29-365)
   so the two bands stack flush, per the score mockup */
#stats{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:0 25px 0 19px;margin-top:30px;box-sizing:border-box;   /* same as #buttons */
  font-family:var(--title-font);
  font-size:11px;color:var(--stat);letter-spacing:.5px;
}
.statCell{display:flex;align-items:center;gap:6px;line-height:1}
.statCell b{font-weight:400;color:var(--stat)}
.ico{
  display:block;background-repeat:no-repeat;background-size:contain;
  background-position:center;image-rendering:pixelated;flex:none;
}
#icoCoin{width:19px;height:17px}
#icoStar{width:19px;height:17px}
#icoTime{width:16px;height:17px}
/* lives */
#lives{gap:3px}
#lives .heart{width:20px;height:16px;image-rendering:pixelated;display:block;flex:none}
#lives.na{opacity:.4}          /* games where lives don't apply, like the disabled PAUSE */
/* pause / continue pill row: pause x29.6, continue ends x313.9, gear x347-368 */
#buttons{
  display:flex;align-items:center;width:100%;
  padding:0 25px 0 19px;margin-top:22px;gap:0;
}
#buttons .pill:nth-child(2){margin-left:27px}
#btnSettings{margin-left:auto}

/* pill button: #A5C5EF face, #203B51 outline, #62819B bottom shade,
   white top highlight — SVG background injected by JS (pillSVG) */
.pill{
  position:relative;border:0;background:transparent;padding:0;cursor:pointer;
  width:132px;height:29px;flex:none;
}
.pill svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.pill span{
  position:relative;z-index:2;display:block;width:100%;text-align:center;
  font-family:var(--title-font);font-size:11px;letter-spacing:1px;
  color:var(--btn-edge);line-height:29px;
}
.pill:active{transform:translate(1px,1px)}
.pill[disabled]{opacity:.5;cursor:default;transform:none}
/* secondary pills (MENU, RESTART) — dimmed face, same shape */
.pill.ghost svg path:nth-of-type(2){fill:var(--dim)}
.pill.ghost span{color:var(--pix-frame)}
/* Settings options: white is the resting state, the chosen one goes blue.
   In pillSVG the rects run: 1-3 = white highlights, 4-5 = bottom shading,
   so only the shading is recoloured and the highlights stay white. */
.pill.opt svg path:nth-of-type(2){fill:var(--opt-face)}
.pill.opt span{color:var(--btn-edge)}
.pill.opt.sel svg path:nth-of-type(2){fill:var(--opt-face-sel)}
.pill.opt.sel svg rect:nth-of-type(4),
.pill.opt.sel svg rect:nth-of-type(5){fill:var(--opt-shade-sel)}
.pill.opt.sel span{color:var(--opt-text-sel)}
/* D-pad highlight — which option the physical controls are sitting on.
   The white outline carries it everywhere; the vertical overlay lists
   have room for pixel carets either side as well. */
.pill.kbFocus svg path:nth-of-type(1){fill:var(--pix-frame)}
#ovBtns .pill.kbFocus::before,#ovBtns .pill.kbFocus::after{
  content:'';position:absolute;top:50%;width:7px;height:12px;
  margin-top:-6px;background:var(--pix-frame);pointer-events:none;z-index:3;
  animation:caretPulse 1s steps(2) infinite;
}
#ovBtns .pill.kbFocus::before{left:-13px;clip-path:polygon(0 50%,100% 0,100% 100%)}
#ovBtns .pill.kbFocus::after {right:-13px;clip-path:polygon(100% 50%,0 0,0 100%)}
@keyframes caretPulse{50%{opacity:.35}}
/* selected (blue) and focused (white outline) are independent states —
   the outline sits on top of whichever face the pill has */
.settingsRow .pill.kbFocus{outline:2px solid var(--pix-frame);outline-offset:2px}

/* ---------- pixel buttons (same stepped language as the d-pad) ---------- */
.pix{
  position:relative;font-family:var(--title-font);border:0;border-radius:0;padding:0;
  background:var(--btn-face);clip-path:var(--pc);cursor:pointer;
  filter:drop-shadow(3px 3px 0 var(--btn-edge));
}
.pix > span{
  position:relative;z-index:2;display:block;padding:12px 16px;
  color:var(--btn-text);font-size:11px;letter-spacing:.5px;
}
.pix:active{transform:translate(2px,2px);filter:drop-shadow(1px 1px 0 var(--btn-edge))}
.pix[disabled]{opacity:.4;cursor:default;transform:none}
.pix.ghost{background:var(--dim)}
.pix.ghost > span{color:var(--block-hi)}
.pix.wide > span{padding:11px 0;text-align:center}
.pix.wide{width:190px}

/* ---------- board — screen rect from nav SVGs:
   371x471, rx 22.5, #0F172A fill, #2760C4 1px stroke,
   #D7E8FF pixel border strip just inside the edge ---------- */
#boardWrap{
  position:relative;width:100%;margin-top:10px;
  /* Height is set by fitCanvas() to exactly ROWS*CELL, so the grid always
     divides the board with nothing left over. Relying on CSS aspect-ratio
     left a fractional remainder and the last row read as an open box. */
  box-sizing:border-box;
  background:var(--board-bg);border:1px solid var(--board-edge);border-radius:22.5px;
  overflow:hidden;
}
#board{display:block;position:absolute}
#pixFrame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
/* game-name band inside the screen (menu only): y596-626 of the 471-tall screen */
#gameLabel{
  position:absolute;left:1px;right:1px;bottom:2px;height:30px;z-index:2;
  display:none;align-items:center;justify-content:center;
  background:var(--label-band);
  font-family:var(--title-font);font-size:17px;letter-spacing:2px;
  color:var(--label-text);
  -webkit-text-stroke:0.5px var(--title-outline);
  text-shadow:1px 1px 0 var(--title-outline);
  user-select:none;pointer-events:none;
}
#gameLabel.show{display:flex}

#overlay{
  position:absolute;inset:0;display:none;
  flex-direction:column;justify-content:center;align-items:center;gap:14px;
  background:rgba(7,13,26,.93);padding:20px;text-align:center;
}
#overlay.show{display:flex}
#ovTitle{font-size:13px;color:var(--block-hi);letter-spacing:1px;line-height:1.6}
#ovSub{font-size:8px;color:var(--stat);line-height:1.9}
#ovBtns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:4px}

/* ---------- console controls ----------
   Three layouts, taken literally from "default nav buttons.svg",
   "left style nav buttons.svg" and "right side nav button style.svg":
     default — D-pad centred, no round button
     left    — round button LEFT,  D-pad RIGHT
     right   — D-pad LEFT,         round button RIGHT
   The round button (r42.5, #162655, 4px #2760C4 ring) is the same
   control in every layout; only its side changes. */
#controlsRow{
  margin-top:31px;width:100%;display:flex;align-items:center;flex:none;
  padding:0 30px;min-height:158px;
}
#dpad{width:158px;height:158px;position:relative;flex:none;touch-action:none}
#dpad svg{width:100%;height:100%;display:block;pointer-events:none}
.dpadHit{position:absolute;cursor:pointer;z-index:2}
.dpadHit.pressed{background:rgba(165,197,239,.22);border-radius:8px}

.selectBtn{
  width:89px;height:89px;border-radius:50%;flex:none;
  background:var(--dpad-bg);border:4px solid var(--dpad-edge);cursor:pointer;padding:0;
}
.selectBtn:active{background:#1d3270}

/* default: D-pad alone, centred */
#controlsRow.hand-default{justify-content:center}
#controlsRow.hand-default .selectBtn{display:none}
/* left: round button left, D-pad right */
#controlsRow.hand-left{justify-content:space-between}
#controlsRow.hand-left .selectBtn{order:1}
#controlsRow.hand-left #dpad{order:2}
/* right: D-pad left, round button right */
#controlsRow.hand-right{justify-content:space-between}
#controlsRow.hand-right #dpad{order:1}
#controlsRow.hand-right .selectBtn{order:2}

/* ---------- settings ---------- */
.gearBtn{
  width:22px;height:26px;background:transparent;border:0;cursor:pointer;padding:0;flex:none;
}
.gearBtn svg{width:100%;height:100%;display:block}
.gearBtn:active{transform:translate(1px,1px)}
.gearBtn.kbFocus{outline:2px solid var(--pix-frame);outline-offset:3px}

/* ---------- splash loader — pixel clouds, recreated in-palette ---------- */
#splash{
  position:absolute;inset:0;z-index:30;overflow:hidden;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 39%,var(--bg-bot) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .5s;cursor:pointer;
}
#splash.hide{opacity:0;pointer-events:none}
.cloud{position:absolute;width:8px;height:8px;background:transparent;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(533px)}}
#splashPresenting{
  font-family:var(--title-font);font-size:13px;letter-spacing:3px;
  color:var(--pix-frame);text-shadow:1px 1px 0 var(--title-shadow);
  margin-bottom:18px;position:relative;z-index:2;
}
#splashTitle{
  font-family:var(--title-font);font-size:34px;letter-spacing:2px;text-align:center;line-height:1.5;
  color:var(--title-fill);
  -webkit-text-stroke:0.8px var(--title-outline);
  text-shadow:3px 3px 0 var(--title-shadow);
  position:relative;z-index:2;
}
#splashLoading{
  font-family:var(--title-font);font-size:9px;letter-spacing:2px;
  color:var(--pix-frame);opacity:.8;margin-top:26px;position:relative;z-index:2;
  animation:blink 1.1s steps(2) infinite;
}
@keyframes blink{50%{opacity:.15}}
/* ---------- settings popup ----------
   Panel + border + red X close taken from "default style.svg",
   "left hand style.svg" and "right hand style.svg". */
.settingsOverlay{
  position:absolute;inset:0;display:none;z-index:40;
  align-items:center;justify-content:center;
  background:rgba(7,13,26,.86);padding:16px;
}
.settingsOverlay.show{display:flex}
/* Panel is a single 5px stepped pixel border with a title bar across the
   top, exactly as drawn in the popup SVGs — the frame itself is an SVG
   sized on open (#panelFrame), so the staircase corners stay square. */
.settingsPanel{
  position:relative;width:334px;max-width:100%;
  box-sizing:border-box;background:var(--panel-bg);
}
#panelFrame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.panelBar{
  position:relative;height:30px;display:flex;align-items:center;
  justify-content:center;z-index:2;
}
.settingsTitle{
  font-family:var(--title-font);font-size:10px;letter-spacing:1.5px;
  color:var(--pix-frame);text-align:center;
}
.panelBody{padding:18px 17px 17px;position:relative;z-index:2}
/* red pixel X close button, inside the title bar at the right */
/* fills the slot the title-bar divider carves out for it */
.closeBtn{
  position:absolute;top:6px;right:7px;width:33px;height:24px;
  background:transparent;border:0;padding:0;cursor:pointer;z-index:5;
}
.closeBtn svg{width:100%;height:100%;display:block}
.closeBtn:active{transform:translate(1px,1px)}
.settingsRow{display:flex;gap:7px;margin-bottom:18px;justify-content:center}
.settingsRow .pill{flex:1;height:30px;min-width:0}
.settingsRow .pill span{font-size:8px;letter-spacing:.5px;line-height:30px}
/* live preview of the chosen control layout */
#handPreview{
  height:104px;margin:0 auto 18px;display:flex;align-items:center;
  padding:0 14px;background:rgba(15,23,42,.55);
  border:2px solid var(--board-edge);
}
#handPreview .pvDpad{width:62px;height:62px;flex:none}
#handPreview .pvRound{
  width:36px;height:36px;border-radius:50%;flex:none;
  background:var(--dpad-bg);border:3px solid var(--dpad-edge);
}
#handPreview.pv-default{justify-content:center}
#handPreview.pv-left,#handPreview.pv-right{justify-content:space-between}
.settingsPanel .pill.wide{width:100%;height:34px;display:block}
.settingsPanel .pill.wide span{line-height:34px}
#btnSound{margin-bottom:9px}
</style>
</head>

<script>
'use strict';

/* =========================================================
   CORE
   ========================================================= */
const COLS = 16, ROWS = 20;

const cv  = document.getElementById('board');
const ctx = cv.getContext('2d');
let CELL = 0, W = 0, H = 0;

const css = getComputedStyle(document.documentElement);
const c = n => css.getPropertyValue(n).trim();
const COL = {
  board:c('--board-bg'), grid:c('--grid'), block:c('--block'), hi:c('--block-hi'),
  white:c('--white'), orange:c('--orange'), yellow:c('--yellow'), dim:c('--dim'),
  stat:c('--stat'), btnFace:c('--btn-face'), btnText:c('--btn-text')
};

// The pixel bezel is BEZEL px thick and sits on top of the board, so the
// canvas has to live INSIDE it — filling the whole wrapper meant the frame
// painted over the outer 7px of the play area and the first/last rows lost
// a third of their height.
const BEZEL = 7;
function fitCanvas(){
  const wrap = document.getElementById('boardWrap');
  const bw = wrap.clientWidth;
  if(!bw) return;
  W    = bw - BEZEL*2;
  CELL = W / COLS;
  H    = Math.round(ROWS * CELL);
  wrap.style.height = (H + BEZEL*2 + 2) + 'px';   // +2 for the 1px border each side
  cv.style.left   = BEZEL + 'px';
  cv.style.top    = BEZEL + 'px';
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildPixFrame(bw, H + BEZEL*2);
}
window.addEventListener('resize', fitCanvas);

/* ---- draw helpers ---- */
function clearBoard(){ ctx.fillStyle = COL.board; ctx.fillRect(0,0,W,H); }

function drawGrid(){
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=1;i<COLS;i++){ const x=Math.round(i*CELL)+.5; ctx.moveTo(x,0); ctx.lineTo(x,H); }
  // Rule every row boundary INCLUDING the last one at the bottom edge.
  // Without that closing line the final row has no blue rule under it and
  // reads as an open rectangle — the bezel is a frame, not a grid line.
  for(let j=1; j<=ROWS; j++){
    const y = Math.min(Math.round(j*CELL)+.5, H-0.5);
    ctx.moveTo(0,y); ctx.lineTo(W,y);
  }
  ctx.stroke();
}
function cellBlock(col,row,fill,edge){
  const x=Math.round(col*CELL), y=Math.round(row*CELL), s=Math.round(CELL);
  ctx.fillStyle = fill || COL.block; ctx.fillRect(x,y,s,s);
  ctx.strokeStyle = edge || COL.hi; ctx.lineWidth = 2;
  ctx.strokeRect(x+1,y+1,s-2,s-2);
}
function pxRect(x,y,w,h,fill,edge){
  ctx.fillStyle = fill; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
  if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=2;
    ctx.strokeRect(Math.round(x)+1,Math.round(y)+1,Math.round(w)-2,Math.round(h)-2); }
}
function dot(cx,cy,r,fill){ ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); }
// pixel-staircase chevron — same construction as the D-pad's stepped arrows (buildDpad),
// just drawn on canvas and rotated into place instead of built as an SVG polygon.
// len = tip-to-base run (along the pointing axis), spread = base width, dir: -1 left, +1 right.
function stepArrow(cx,cy,len,spread,dir,fill){
  const n=4, stepX=spread/(2*n), stepY=len/n;
  const pts=[[stepX,0]];
  for(let i=0;i<n;i++){ pts.push([(i+1)*stepX, i*stepY]); pts.push([(i+1)*stepX,(i+1)*stepY]); }
  pts.push([-n*stepX, n*stepY]);
  for(let i=n-1;i>=0;i--){ pts.push([-(i+1)*stepX,(i+1)*stepY]); pts.push([-(i+1)*stepX, i*stepY]); }
  pts.push([-stepX,0]);
  const yShift = n*stepY/2;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(dir>0 ? Math.PI/2 : -Math.PI/2);
  ctx.fillStyle=fill;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]-yShift);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]-yShift);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function label(text,x,y,size,col,align){
  ctx.font = `${Math.max(6,Math.round(size))}px "LomoWebPixelLTStd-5", "Press Start 2P", monospace`;
  ctx.fillStyle = col; ctx.textAlign = align||'center'; ctx.textBaseline='middle';
  ctx.fillText(text,x,y);
}

/* =========================================================
   "BASE" WORDMARK — the brick wall in Breakout / Brick Shooter
   ========================================================= */
const GLYPH = {
  B:['110','101','110','101','110'],
  A:['010','101','111','101','101'],
  S:['111','100','111','001','111'],
  E:['111','100','110','100','111']
};
function baseBricks(top){
  const out=[]; let col=1;
  for(const ch of 'BASE'){
    const g=GLYPH[ch];
    for(let r=0;r<g.length;r++)
      for(let k=0;k<g[r].length;k++)
        if(g[r][k]==='1') out.push({c:col+k, r:top+r, alive:true});
    col += 4;
  }
  return out;
}

/* level 1..5 wall patterns shared by Breakout & Brick Shooter — each
   denser/taller than the last so both games get harder the same way */
// row the wall starts on. Kept at 1 — the position in the original mock.
const WALL_TOP = 1;
function wallPattern(level){
  const lvl = Math.max(1, Math.min(level, 5));
  const T = WALL_TOP;
  if(lvl===1) return baseBricks(T);
  const out=[];
  if(lvl===2){                          // pyramid, widening downward
    const widths=[4,6,8,10,12];
    widths.forEach((w,i)=>{
      const r=T+i, startC=Math.floor((COLS-w)/2);
      for(let k=0;k<w;k++) out.push({c:startC+k, r, alive:true});
    });
  } else if(lvl===3){                   // solid block, 4 rows, full width
    for(let r=T;r<=T+3;r++) for(let c=0;c<COLS;c++) out.push({c,r,alive:true});
  } else if(lvl===4){                   // checkerboard, 6 rows
    for(let r=T;r<=T+5;r++) for(let c=0;c<COLS;c++) if((c+r)%2===0) out.push({c,r,alive:true});
  } else {                              // fortress: two solid bands, gap row between
    for(let r=T;r<=T+1;r++)   for(let c=0;c<COLS;c++) out.push({c,r,alive:true});
    for(let r=T+3;r<=T+4;r++) for(let c=0;c<COLS;c++) out.push({c,r,alive:true});
  }
  return out;
}

/* =========================================================
   SOUND — synthesised, not sampled. Square and triangle waves
   through the browser's own oscillators, which is how the chips
   in these machines actually worked. No audio files, so the
   single-file constraint holds.
   Off by default: browsers block audio until the first user
   gesture, so an on-by-default toggle would read "ON" while
   silent and look broken.
   ========================================================= */
let audioCtx = null, soundOn = false;
try { soundOn = localStorage.getItem('baseArcadeSound') === 'on'; } catch(e){}

function setSound(on){
  soundOn = on;
  try { localStorage.setItem('baseArcadeSound', on?'on':'off'); } catch(e){}
  const b = document.getElementById('btnSound');
  if(b){ b.classList.toggle('sel', on); b.querySelector('span').textContent = on ? 'SOUND ON' : 'SOUND OFF'; }
  if(on) blip(660, 0.06, 'square', 0.16);   // confirmation chirp
}
function ac(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// one note: freq (or [from,to] to sweep), length in seconds
function blip(freq, dur, type, gain, delay){
  if(!soundOn) return;
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = type || 'square';
  if(Array.isArray(freq)){
    osc.frequency.setValueAtTime(freq[0], t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1,freq[1]), t0+dur);
  } else osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain||0.2, t0+0.008);   // fast attack
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);        // decay to silence
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
// per-game base pitch so each machine has its own voice
const GAME_PITCH = { breakout:0, snake:2, brickshooter:-2, pacman:3, tetris:-4, frogger:5 };
const semitone = n => Math.pow(2, n/12);
function sfx(name){
  if(!soundOn) return;
  const k = semitone(GAME_PITCH[S.key] || 0);
  switch(name){
    case 'hit':    blip(420*k, 0.05, 'square',   0.16); break;   // paddle / wall
    case 'brick':  blip(720*k, 0.05, 'square',   0.15); break;   // brick broken
    case 'eat':    blip(560*k, 0.06, 'triangle', 0.2);
                   blip(840*k, 0.07, 'triangle', 0.18, 0.05); break;
    case 'shoot':  blip([900*k, 300*k], 0.09, 'square', 0.12); break;
    case 'rotate': blip(300*k, 0.04, 'square',   0.1);  break;
    case 'line':   [0,4,7,12].forEach((n,i)=> blip(440*semitone(n), 0.09, 'square', 0.16, i*0.045)); break;
    case 'level':  [0,5,9,14].forEach((n,i)=> blip(392*semitone(n), 0.11, 'triangle', 0.2, i*0.07)); break;
    case 'life':   blip([500, 180], 0.28, 'triangle', 0.22); break;
    case 'over':   [0,-3,-7,-12].forEach((n,i)=> blip(392*semitone(n), 0.16, 'square', 0.2, i*0.12)); break;
  }
}

/* =========================================================
   LEADERBOARD
   Your own runs are real and persist in localStorage. The other
   entries are placeholders — with no server there is no way for
   two players' scores to ever meet. If this ever runs inside the
   Base app, replace fetchBoard() with a call to the host SDK and
   nothing else here has to change.
   ========================================================= */
const BOARD_SIZE = 5;
const SEED_BOARD = [
  { name:'UNOVERSE',  score:580 },
  { name:'VARISH P.', score:480 },
  { name:'PLAYER 4',  score:80  },
  { name:'PLAYER 5',  score:50  }
];
let bestScore = 0;
try { bestScore = parseInt(localStorage.getItem('baseArcadeBest')||'0',10) || 0; } catch(e){}

// returns the player's rank if this run made the board, else 0
function submitScore(key, score){
  if(!score) return 0;
  const improved = score > bestScore;
  if(improved){
    bestScore = score;
    try { localStorage.setItem('baseArcadeBest', String(score)); } catch(e){}
  }
  const rank = fetchBoard().findIndex(r=>r.you) + 1;
  return improved && rank ? rank : 0;
}
// merges your best run into the placeholder board, sorted
function fetchBoard(){
  const rows = SEED_BOARD.map(r=>({...r, you:false}));
  if(bestScore > 0) rows.push({ name:'YOU', score:bestScore, you:true });
  rows.sort((a,b)=> b.score - a.score);
  return rows.slice(0, BOARD_SIZE);
}

/* how many lives each game gets; 0 = the concept doesn't apply and the
   hearts show dimmed, the way the PAUSE button does on the menu */
const MAX_LIVES = 3;
const LIVES_GAMES = { breakout:1, brickshooter:1, pacman:1, frogger:1, snake:1, tetris:0 };

function paintIcons(){
  document.getElementById('icoCoin').style.backgroundImage = `url(${ICON.coin})`;
  document.getElementById('icoStar').style.backgroundImage = `url(${ICON.star})`;
  document.getElementById('icoTime').style.backgroundImage = `url(${ICON.hourglass})`;
}
function drawLives(){
  const box = document.getElementById('lives');
  const applies = S.livesApply;
  box.classList.toggle('na', !applies);
  const shown = applies ? S.lives : 0;
  let html = '';
  for(let i=0;i<MAX_LIVES;i++){
    html += `<img class="heart" alt="" src="${i<shown ? ICON.heart : ICON.heartEmpty}">`;
  }
  box.innerHTML = html;
}
function fmtTime(t){
  const s = Math.max(0, Math.floor(t));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function hud(){
  el.coins.textContent = S.coins;
  el.score.textContent = String(S.score).padStart(3,'0');
  el.time.textContent  = fmtTime(S.time);
  drawLives();
}
function showOverlay(title, sub, buttons){
  el.ovT.textContent = title;
  el.ovS.innerHTML  = sub || '';
  el.ovB.innerHTML  = '';
  (buttons||[]).forEach(b=>{
    const n = makePill(b.label, b.ghost?'ghost':'', 200, 34);
    n.onclick = b.onClick;
    n.addEventListener('pointerenter', ()=>focusIn(el.ovB, [...el.ovB.children].indexOf(n)));
    el.ovB.appendChild(n);
  });
  el.ov.classList.add('show');
  focusIn(el.ovB, 0);                 // D-pad starts on the first option
}
const hideOverlay = () => { el.ov.classList.remove('show'); clearFocus(); };

/* =========================================================
   MENU FOCUS — lets the physical controls drive every panel.
   Whichever container is "active" (an overlay or the settings
   panel) owns a highlighted button; up/down (and left/right)
   move the highlight, the centre button activates it.
   ========================================================= */
const Focus = { host:null, idx:0 };

function focusables(host){
  return host ? [...host.querySelectorAll('button')]
    .filter(b=>!b.disabled && !b.hasAttribute('data-nofocus')) : [];
}
function paintFocus(){
  document.querySelectorAll('.kbFocus').forEach(n=>n.classList.remove('kbFocus'));
  const list = focusables(Focus.host);
  if(list[Focus.idx]) list[Focus.idx].classList.add('kbFocus');
}
function focusIn(host, idx){
  Focus.host = host;
  const list = focusables(host);
  if(!list.length){ Focus.host=null; return; }
  Focus.idx = Math.max(0, Math.min(idx||0, list.length-1));
  paintFocus();
}
function clearFocus(){
  Focus.host = null;
  document.querySelectorAll('.kbFocus').forEach(n=>n.classList.remove('kbFocus'));
}
function moveFocus(step){
  const list = focusables(Focus.host);
  if(!list.length) return;
  Focus.idx = (Focus.idx + step + list.length) % list.length;
  paintFocus();
}
function activateFocus(){
  const list = focusables(Focus.host);
  const btn = list[Focus.idx];
  if(btn) btn.click();
}
/* true when a panel is up and should be consuming the controls */
function focusActive(){ return !!Focus.host && Focus.host.isConnected; }

/* =========================================================
   INPUT
   ========================================================= */
const held = { left:false, right:false, up:false, down:false };

function press(dir){
  if(dir in held) held[dir]=true;

  // splash: any button skips it
  if(S.screen==='splash'){ if(dir==='action') finishSplash(); return; }

  // a panel is open (pause / game over / level up / settings): the
  // controls drive that panel instead of the game
  if(focusActive()){
    // in the header row left/right walk the buttons and down drops back
    // to the board; everywhere else it's a plain vertical list
    if(Focus.host === el.header){
      if(dir==='right') return moveFocus(1);
      if(dir==='left')  return moveFocus(-1);
      if(dir==='down' || dir==='up'){ clearFocus(); return; }
      if(dir==='action') return activateFocus();
      return;
    }
    if(dir==='down'  || dir==='right') return moveFocus(1);
    if(dir==='up'    || dir==='left')  return moveFocus(-1);
    if(dir==='action')                 return activateFocus();
    return;
  }

  // on the carousel the up/down axis is free (the carousel only uses
  // left/right): up reaches the header row, down opens the scores
  if(S.screen==='menu' && dir==='up'){ focusIn(el.header, 0); return; }
  if(S.screen==='menu' && dir==='down'){ openLeaderboard(); return; }

  if(S.paused || S.over) return;
  if(G && G.press) G.press(dir);
}
const release = dir => { if(dir in held) held[dir]=false; };

/* The D-pad artwork itself is the verbatim vector slice from the nav
   SVGs, already present inside #dpad in the markup. Here we only lay
   transparent hit zones over it (4 directions + centre = action). */
function buildDpad(){
  const dpad = document.getElementById('dpad');
  const zones = [
    {d:'up',    x:39, y:0,   w:80, h:48},
    {d:'down',  x:39, y:110, w:80, h:48},
    {d:'left',  x:0,  y:39,  w:48, h:80},
    {d:'right', x:110,y:39,  w:48, h:80},
    {d:'action',x:50, y:50,  w:58, h:58}
  ];
  for(const z of zones){
    const n=document.createElement('div');
    n.className='dpadHit'; n.dataset.dir=z.d;
    n.style.cssText=`left:${z.x/158*100}%;top:${z.y/158*100}%;width:${z.w/158*100}%;height:${z.h/158*100}%`;
    const on = e => { e.preventDefault(); n.classList.add('pressed'); press(z.d); };
    const off= e => { e.preventDefault(); n.classList.remove('pressed'); release(z.d); };
    n.addEventListener('pointerdown',on);
    n.addEventListener('pointerup',off);
    n.addEventListener('pointerleave',off);
    n.addEventListener('pointercancel',off);
    dpad.appendChild(n);
  }
}

/* PAUSE / CONTINUE pill background — exact construction from the nav
   SVG header buttons: 2.6px pixel unit, #203B51 outline, #A5C5EF face,
   two-segment bevelled ends, #62819B inner bottom shadow, white top
   highlight row at 29% + solid white shine streak top-left. */
/* settings panel frame: one 5px pixel border with a two-step staircase
   corner, plus the title-bar divider and the close-button divider —
   the structure read straight out of the popup SVGs */
function buildPanelFrame(){
  const panel = document.querySelector('.settingsPanel');
  const svg   = document.getElementById('panelFrame');
  if(!panel || !svg) return;
  const w = Math.round(panel.getBoundingClientRect().width);
  const h = Math.round(panel.getBoundingClientRect().height);
  if(!w || !h) return;
  const u = 5, BAR = 30;               // border unit, title-bar height
  const r = [];
  const R = (x,y,ww,hh)=>r.push(`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" fill="var(--panel-edge)"/>`);
  R(2*u, 0,      w-4*u, u);            // top edge, inset two blocks
  R(2*u, h-u,    w-4*u, u);            // bottom edge
  R(0,   2*u,    u,     h-4*u);        // left edge
  R(w-u, 2*u,    u,     h-4*u);        // right edge
  R(u,     u,     u, u); R(w-2*u,     u, u, u);   // staircase corner steps
  R(u, h-2*u,     u, u); R(w-2*u, h-2*u, u, u);
  R(0,   BAR,    w,     u);            // divider under the title bar
  R(w-9*u, u,    u,     BAR-u);        // divider before the close button
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = r.join('');
}

function pillSVG(w, h){
  w = w || 132; h = h || 29;
  const u = 2.6;                       // the SVG's pixel unit
  // face octagon: bevels (u*2,0)->(u*1,u*1)->(0,u*3) pattern from the SVG
  const face=`M${u*3+2.6} ${u}L${w-u*3-2.6} ${u}L${w-u-2.6} ${u*2}L${w-2.6} ${u*3+1.4}L${w-2.6} ${h-u*3-1.4}L${w-u-2.6} ${h-u*2}L${w-u*3-2.6} ${h-u}L${u*3+2.6} ${h-u}L${u+2.6} ${h-u*2}L${2.6} ${h-u*3-1.4}L${2.6} ${u*3+1.4}L${u+2.6} ${u*2}Z`;
  const outline=`M${u*3+2.6} 0L${w-u*3-2.6} 0L${w-u} ${u*1.2}L${w} ${u*3}L${w} ${h-u*3}L${w-u} ${h-u*1.2}L${w-u*3-2.6} ${h}L${u*3+2.6} ${h}L${u} ${h-u*1.2}L0 ${h-u*3}L0 ${u*3}L${u} ${u*1.2}Z`;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="${outline}" fill="var(--pill-outline)"/>
    <path d="${face}" fill="var(--pill-face)"/>
    <rect x="${u*4}" y="${u}" width="${w-u*8}" height="${u}" fill="#ffffff" opacity="0.29"/>
    <rect x="${u*4}" y="${u*2}" width="${u*5}" height="${u}" fill="#ffffff"/>
    <rect x="${u*3}" y="${u*2}" width="${u}" height="${u*2}" fill="#ffffff"/>
    <rect x="${u*4}" y="${h-u*2}" width="${w-u*8}" height="${u}" fill="var(--pill-shade)"/>
    <rect x="${w-u*4}" y="${h-u*3}" width="${u}" height="${u}" fill="var(--pill-shade)"/>
  </svg>`;
}
function buildPills(){
  document.querySelectorAll('.pill').forEach(b=>{
    const r = b.getBoundingClientRect();
    b.insertAdjacentHTML('afterbegin', pillSVG(Math.round(r.width)||132, Math.round(r.height)||29));
  });
}
/* build a pill <button> on the fly — used by every overlay (game over,
   pause, level up) and the settings panel, so they all share one look */
function makePill(labelText, cls, w, h){
  const b=document.createElement('button');
  b.className='pill '+(cls||'');
  if(w) b.style.width=w+'px';
  if(h) b.style.height=h+'px';
  b.innerHTML = pillSVG(w||190, h||34);
  const s=document.createElement('span');
  s.textContent=labelText;
  if(h) s.style.lineHeight=h+'px';
  b.appendChild(s);
  return b;
}

/* white pixel border strip just inside the screen edge (#D7E8FF in the
   SVGs) — straight runs with stepped corners, drawn at exact mock
   proportions on the 371x471 screen */
function buildPixFrame(fw, fh){
  const svg=document.getElementById('pixFrame');
  if(!fw || !fh) return;
  const W=fw, H=fh, t=BEZEL, inset=0.5, c=16;   // c = corner cut span
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio','none');
  const strips=[
    // top, bottom, left, right straight runs (inset by corner span)
    `M${c} ${inset}H${W-c}V${inset+t}H${c}Z`,
    `M${c} ${H-inset-t}H${W-c}V${H-inset}H${c}Z`,
    `M${inset} ${c}V${H-c}H${inset+t}V${c}Z`,
    `M${W-inset-t} ${c}V${H-c}H${W-inset}V${c}Z`,
    // stepped corner blocks
    `M${c-7} ${inset+3}h7v7h-7Z`, `M${inset+3} ${c-7}h7v7h-7Z`,
    `M${W-c} ${inset+3}h7v7h-7Z`, `M${W-inset-10} ${c-7}h7v7h-7Z`,
    `M${c-7} ${H-inset-10}h7v7h-7Z`, `M${inset+3} ${H-c}h7v7h-7Z`,
    `M${W-c} ${H-inset-10}h7v7h-7Z`, `M${W-inset-10} ${H-c}h7v7h-7Z`
  ];
  svg.innerHTML = strips.map(d=>`<path d="${d}" fill="var(--pix-frame)"/>`).join('');
}

// pixel-art cloud built from box-shadow blocks
function makeCloud(shape, y, scale, dur, delay, opacity){
  const n=document.createElement('div');
  n.className='cloud';

  n.style.width=n.style.height=p+'px';

  shape.forEach((row,ry)=>{ [...row].forEach((ch,rx)=>{
    if(ch==='X') sh.push(`${rx*p}px ${ry*p}px 0 #D7E8FF`);
  }); });
  n.style.boxShadow=sh.join(',');
  n.style.top=y+'px';
  n.style.left='-90px';
  n.style.opacity=opacity;
  n.style.animationDuration=dur+'s';
  n.style.animationDelay=delay+'s';
  splashEl.appendChild(n);
}

    this.sel = (i+n)%n;

    if(d==='right') this.show(this.sel+1);
    if(d==='action') start(CATALOG[this.sel].key);
  },
  // tap on an arrow cycles; tapping anywhere else on the screen starts the game
  hit(px,py){
    const zone = W*0.22, y0 = H*0.28, y1 = H*0.62;
    if(py>y0 && py<y1 && px < zone)   return this.press('left');
    if(py>y0 && py<y1 && px > W-zone) return this.press('right');
    this.press('action');
  },
  draw(){
    const g = CATALOG[this.sel].game;
    if(g && g.draw) g.draw();

    // arrow geometry straight from the nav SVGs: stepped chevrons
    // 31.2 x 56.2 on the 371-wide screen, centre-line at 44.3% height,
    // tips 17.5px in from each edge. White = next, blue = previous;
    // colours flip on the last tile (loop-back to nav 1 cue).
    const sc = W/371;
    const ay = H*0.4428, len = 31.2*sc, spread = 56.2*sc;
    const lcx = 33.1*sc, rcx = W - 32.65*sc;

    stepArrow(lcx, ay, len, spread, -1, isLast ? '#EEEFF1' : '#2760C4');
    stepArrow(rcx, ay, len, spread,  1, isLast ? '#2760C4' : '#EEEFF1');

/* =========================================================
   GAME 1 — BREAKOUT   (ball pace reduced ~40%)
   ========================================================= */
const Breakout = {
  title:'BREAKOUT',
  init(){
    this.initLevel();
  },
  initLevel(){
    const lvl = Math.min(S.level,5);
    this.bricks = wallPattern(lvl);
    this.speedMul = 1 + (lvl-1)*0.08;                 // +8% ball pace per level
    this.padW = Math.max(2, 3-(lvl-1)*0.25)*CELL;      // paddle shrinks a bit each level
    this.padH = CELL*0.6;
    this.padX = W/2 - this.padW/2;
    this.reset();
  },
  reset(){
    this.bx = W/2; this.by = H - CELL*3;
    const a = -Math.PI/2 + (Math.random()*0.6-0.3);
    this.speed = CELL*5.4*this.speedMul;   // was 9
    this.vx = Math.cos(a)*this.speed; this.vy = Math.sin(a)*this.speed;
    this.trail = [];
  },
  // losing a life gives you a fresh ball but keeps the wall you've broken
  respawn(){ this.padX = W/2 - this.padW/2; this.reset(); },
  press(){},
  update(dt){
    const sp = CELL*9;
    if(held.left)  this.padX -= sp*dt;
    if(held.right) this.padX += sp*dt;
    this.padX = Math.max(0, Math.min(W-this.padW, this.padX));

    this.bx += this.vx*dt; this.by += this.vy*dt;
    const r = CELL*0.22;

    if(this.bx<r){ this.bx=r; this.vx=Math.abs(this.vx); }
    if(this.bx>W-r){ this.bx=W-r; this.vx=-Math.abs(this.vx); }
    if(this.by<r){ this.by=r; this.vy=Math.abs(this.vy); }

    const padY = H - CELL*1.6;
    if(this.vy>0 && this.by+r>=padY && this.by-r<=padY+this.padH &&
       this.bx>=this.padX-r && this.bx<=this.padX+this.padW+r){
      this.by = padY-r;
      const hit = (this.bx-(this.padX+this.padW/2))/(this.padW/2);
      const a = -Math.PI/2 + hit*0.9;
      this.vx = Math.cos(a)*this.speed; this.vy = Math.sin(a)*this.speed;
      this.speed = Math.min(this.speed*1.004, CELL*8.5*this.speedMul);   // gentler ramp, lower ceiling
    }

    for(const b of this.bricks){
      if(!b.alive) continue;
      const x=b.c*CELL, y=b.r*CELL;
      if(this.bx+r>x && this.bx-r<x+CELL && this.by+r>y && this.by-r<y+CELL){
        b.alive=false; S.score+=10; S.coins+=1; sfx('brick');
        const ox = Math.min(this.bx+r-x, x+CELL-(this.bx-r));
        const oy = Math.min(this.by+r-y, y+CELL-(this.by-r));
        if(ox<oy) this.vx=-this.vx; else this.vy=-this.vy;
        break;
      }
    }

    this.trail.unshift({x:this.bx,y:this.by});
    if(this.trail.length>14) this.trail.pop();

    if(this.bricks.every(b=>!b.alive)){
      S.level++; this.initLevel();
      return levelUp('WALL CLEARED');
    }
    if(this.by-r>H) return gameOver('BALL LOST');
  },
  draw(){
    for(const b of this.bricks) if(b.alive) cellBlock(b.c,b.r);
    for(let i=4;i<this.trail.length;i+=4)
      dot(this.trail[i].x,this.trail[i].y,CELL*0.16,'rgba(251,191,36,.4)');
    // glowing yellow pixel ball, straight from the nav-1 mock (#FBBF24 + soft glow)
    ctx.save();
    ctx.shadowColor='rgba(251,191,36,.76)'; ctx.shadowBlur=CELL*0.5;
    pxRect(this.bx-CELL*0.32, this.by-CELL*0.32, CELL*0.64, CELL*0.64, COL.yellow);
    ctx.restore();
    pxRect(this.padX, H-CELL*1.6, this.padW, this.padH, '#3778E2', COL.hi);
  }
};

   GAME 2 — BRICK SHOOTER

    this.shots = []; this.cool = 0; this.drop = 0; this.offset = 0;
  },
  // Keep the bricks you've cleared, but put the wall back somewhere you can
  // actually survive. Nudging the offset by a fixed amount was not enough —
  // the wall stayed past the breach line and the next frame killed you again,
  // burning all three lives in three frames.
  respawn(){
    const alive = this.bricks.filter(b=>b.alive);
    const lowest = alive.length ? Math.max(...alive.map(b=>b.r)) : 0;
    this.offset = Math.max(0, (ROWS-9) - lowest);   // ~5 rows clear of the breach line
    this.col = COLS >> 1; this.moveT = 0; this.shots = []; this.cool = 0; this.drop = 0;
  },
  stepCol(d){
    this.col = Math.max(0, Math.min(COLS-1, this.col + d));
    this.moveT = 0.14;                       // repeat delay when the pad is held
  },
  fire(){
    if(this.cool>0) return;
    this.cool = 0.3; sfx('shoot');
    this.shots.push({ col:this.col, x:(this.col+0.5)*CELL, y:(ROWS-2.4)*CELL });
  },
  press(d){
    if(d==='left')  this.stepCol(-1);
    if(d==='right') this.stepCol(1);
    if(d==='up' || d==='action') this.fire();
  },
  update(dt){
    this.moveT -= dt; this.cool -= dt;
    if(this.moveT<=0){
      if(held.left)       this.stepCol(-1);
      else if(held.right) this.stepCol(1);
    }
    if(held.up) this.fire();

    this.drop += dt;
    if(this.drop > this.creepInterval){ this.drop = 0; this.offset += 1; }

    for(const s of this.shots) s.y -= CELL*15*dt;
    this.shots = this.shots.filter(s=>s.y > -CELL);

    // resolve on grid indices, never float overlap: a shot carries the column
    // it was fired from, so it can never slip between two adjacent bricks
    for(const s of this.shots){
      const sr = Math.floor(s.y / CELL) - this.offset;
      for(const b of this.bricks){
        if(b.alive && b.c===s.col && b.r===sr){
          b.alive=false; S.score+=15; S.coins+=1; s.dead=true; break;
        }
      }
    }
    this.shots = this.shots.filter(s=>!s.dead);

    if(this.bricks.every(b=>!b.alive)){
      S.level++; this.initLevel();
      return levelUp('WALL CLEARED');
    }
    const low = Math.max(...this.bricks.filter(b=>b.alive).map(b=>b.r+this.offset));
    if(low >= ROWS-4) return gameOver('WALL BREACHED');
  },
  draw(){
    for(const b of this.bricks) if(b.alive) cellBlock(b.c, b.r+this.offset);
    for(const s of this.shots)
      pxRect(s.x-CELL*0.3, s.y-CELL*0.3, CELL*0.6, CELL*0.6, COL.orange, '#ffd77a');
    // turret: three blocks along the floor, one muzzle block on top
    for(const d of [-1,0,1]){
      const cc = this.col + d;
      if(cc>=0 && cc<COLS) cellBlock(cc, ROWS-1, COL.block, COL.hi);
    }
    cellBlock(this.col, ROWS-2, COL.orange, '#ffd77a');
  }
};

/* =========================================================
   GAME 3 — PAC MAN   (step time raised 0.16 -> 0.27, ~40% slower)
   ========================================================= */
const PAC_MAPS = [
  [ // level 1
    '................','##..............','.#..............','................',
    '...##...........','................','.......##.......','........#.......',
    '................','................','..###...........','................',
    '................','................','.####...........','................',
    '..............#.','..............#.','............###.','................'
  ],
  [ // level 2 — horizontal mirror of level 1
    '................','..............##','..............#.','................',
    '...........##...','................','.......##.......','.......#........',
    '................','................','...........###..','................',
    '................','................','...........####.','................',
    '.#..............','.#..............','.###............','................'
  ],
  [ // level 3 — vertical mirror of level 1
    '................','............###.','..............#.','..............#.',
    '................','.####...........','................','................',
    '................','..###...........','................','................',
    '........#.......','.......##.......','................','...##...........',
    '................','.#..............','##..............','................'
  ],
  [ // level 4 — 180° rotation of level 1
    '................','.###............','.#..............','.#..............',
    '................','...........####.','................','................',
    '................','...........###..','................','................',
    '.......#........','.......##.......','................','...........##...',
    '................','..............#.','..............##','................'
  ],
  [ // level 5 — denser four-room maze, hardest
    '................','.####......####.','.#............#.','.#.##....##...#.',
    '.#.#......#...#.','.#............#.','.##############.','................',
    '......##.#......','......#..#......','......#..#......','......####......',
    '................','.##############.','.#............#.','.#.#......#...#.',
    '.#.##....##...#.','.#............#.','.####......####.','................'
  ]
];
const PacMan = {
  title:'PAC MAN',
  init(){
    this.initLevel();
  },
  initLevel(){
    const lvl = Math.min(S.level,5);
    const map = PAC_MAPS[lvl-1];
    this.wall = map.map(r=>r.split('').map(ch=>ch==='#'));
    this.dots = map.map(r=>r.split('').map(ch=>ch==='.'));
    this.p = {c:8, r:9, dir:'left', next:null, t:0};
    this.dots[9][8]=false;
    const ghostCount = Math.min(2+(lvl-1), 6);        // 2 -> 6 ghosts across levels 1-5
    const ghostColors = ['#e8657a','#7ae0d8','#c98af0','#f0a868'];
    const ghostStarts = [{c:2,r:2},{c:13,r:17},{c:13,r:2},{c:2,r:17}];
    this.ghosts = [];
    for(let i=0;i<ghostCount;i++){
      const st = ghostStarts[i%ghostStarts.length];
      this.ghosts.push({c:st.c, r:st.r, dir:'right', t:0, col:ghostColors[i%ghostColors.length]});
    }
    this.step = Math.max(0.16, 0.27-(lvl-1)*0.02);    // slightly faster pac each level
    this.left = this.dots.flat().filter(Boolean).length;
  },
  // dots you've eaten stay eaten; pac and the ghosts go back to their corners
  respawn(){
    this.p = {c:8, r:9, dir:'left', next:null, t:0};
    const starts = [{c:2,r:2},{c:13,r:17},{c:13,r:2},{c:2,r:17}];
    this.ghosts.forEach((g,i)=>{ const st=starts[i%starts.length]; g.c=st.c; g.r=st.r; g.t=0; });
  },
  free(c,r){ return c>=0 && c<COLS && r>=0 && r<ROWS && !this.wall[r][c]; },
  press(d){ if(['up','down','left','right'].includes(d)) this.p.next = d; },
  move(e,d){
    const dc = d==='left'?-1:d==='right'?1:0;
    const dr = d==='up'?-1:d==='down'?1:0;
    return {c:e.c+dc, r:e.r+dr};
  },
  update(dt){
    const p=this.p;
    p.t += dt;
    if(p.t >= this.step){
      p.t -= this.step;
      if(p.next){ const t=this.move(p,p.next); if(this.free(t.c,t.r)){ p.dir=p.next; p.next=null; } }
      const t=this.move(p,p.dir);
      if(this.free(t.c,t.r)){ p.c=t.c; p.r=t.r; }
      if(this.dots[p.r][p.c]){ this.dots[p.r][p.c]=false; S.coins+=1; S.score+=10; this.left--; sfx('eat'); }
      if(this.left<=0){
        S.level++; this.initLevel();
        return levelUp('ALL DOTS EATEN');
      }
    }
    for(const g of this.ghosts){
      g.t += dt;
      if(g.t >= this.step*1.5){
        g.t = 0;
        const opts=['up','down','left','right'].filter(d=>{
          const t=this.move(g,d); return this.free(t.c,t.r);
        });
        if(opts.length){
          opts.sort((a,b)=>{
            const A=this.move(g,a), B=this.move(g,b);
            return (Math.abs(A.c-p.c)+Math.abs(A.r-p.r)) - (Math.abs(B.c-p.c)+Math.abs(B.r-p.r));
          });
          g.dir = Math.random()<0.7 ? opts[0] : opts[Math.floor(Math.random()*opts.length)];
          const t=this.move(g,g.dir); g.c=t.c; g.r=t.r;
        }
      }
      if(g.c===p.c && g.r===p.r) return gameOver('CAUGHT BY GHOST');
    }
  },
  draw(){
    for(let r=0;r<ROWS;r++) for(let k=0;k<COLS;k++){
      if(this.wall[r][k]) cellBlock(k,r);
      else if(this.dots[r][k]) dot((k+.5)*CELL,(r+.5)*CELL,CELL*0.13,'#8fc0f5');
    }
    const px=(this.p.c+.5)*CELL, py=(this.p.r+.5)*CELL;
    const base={left:Math.PI,right:0,up:-Math.PI/2,down:Math.PI/2}[this.p.dir];
    const mouth = 0.30*Math.abs(Math.sin(S.time*7));
    ctx.fillStyle=COL.yellow; ctx.beginPath(); ctx.moveTo(px,py);
    ctx.arc(px,py,CELL*0.42, base+mouth, base-mouth+Math.PI*2);
    ctx.closePath(); ctx.fill();
    for(const g of this.ghosts){
      const gx=g.c*CELL, gy=g.r*CELL;
      ctx.fillStyle=g.col; ctx.beginPath();
      ctx.arc(gx+CELL/2, gy+CELL*0.45, CELL*0.36, Math.PI, 0);
      ctx.lineTo(gx+CELL*0.86, gy+CELL*0.86);
      ctx.lineTo(gx+CELL*0.14, gy+CELL*0.86);
      ctx.closePath(); ctx.fill();
    }
  }
};

/* =========================================================
   GAME 4 — SNAKE CLASH
   ========================================================= */
const Snake = {
  title:'SNAKE & BALL',
  levelThresholds:[80,200,360,560],   // score needed to advance out of levels 1-4
  init(){
    this.body=[{c:8,r:8},{c:7,r:8},{c:6,r:8},{c:5,r:8}];
    this.dir='right'; this.next='right'; this.t=0; this.step=0.2;
    this.obstacles=[];
    this.food=this.spawn();
  },
  // a life gives you a fresh short snake back in the middle; your score,
  // your obstacles and the food on the board all carry over
  respawn(){
    this.body=[{c:8,r:8},{c:7,r:8},{c:6,r:8},{c:5,r:8}];
    this.dir='right'; this.next='right'; this.t=0;
    this.grow=0;
    // if the restart spot is buried under obstacles, clear just enough room
    this.obstacles = this.obstacles.filter(o => !this.body.some(b=>b.c===o.c&&b.r===o.r));
    if(this.body.some(b=>b.c===this.food.c&&b.r===this.food.r)) this.food=this.spawn();
  },
  spawn(){
    let f;
    do{ f={c:(Math.random()*COLS)|0, r:(Math.random()*ROWS)|0}; }
    while(this.body.some(b=>b.c===f.c&&b.r===f.r) || this.obstacles.some(o=>o.c===f.c&&o.r===f.r));
    return f;
  },
  spawnObstacles(count){
    const obs=[];
    while(obs.length<count){
      const o={c:(Math.random()*COLS)|0, r:(Math.random()*ROWS)|0};
      const clash = this.body.some(b=>b.c===o.c&&b.r===o.r) ||
                    (this.food.c===o.c && this.food.r===o.r) ||
                    obs.some(x=>x.c===o.c&&x.r===o.r);
      if(!clash) obs.push(o);
    }
    this.obstacles = obs;
  },
  press(d){
    const opp={left:'right',right:'left',up:'down',down:'up'};
    if(['up','down','left','right'].includes(d) && opp[d]!==this.dir) this.next=d;
  },
  update(dt){
    this.t+=dt;
    if(this.t<this.step) return;
    this.t=0; this.dir=this.next;
    const h=this.body[0];
    const dc=this.dir==='left'?-1:this.dir==='right'?1:0;
    const dr=this.dir==='up'?-1:this.dir==='down'?1:0;
    const nh={c:h.c+dc, r:h.r+dr};
    if(nh.c<0||nh.c>=COLS||nh.r<0||nh.r>=ROWS) return gameOver('HIT THE WALL');
    if(this.body.some(b=>b.c===nh.c&&b.r===nh.r)) return gameOver('BIT YOURSELF');
    if(this.obstacles.some(o=>o.c===nh.c&&o.r===nh.r)) return gameOver('HIT AN OBSTACLE');
    this.body.unshift(nh);
    if(nh.c===this.food.c && nh.r===this.food.r){
      S.coins+=1; S.score+=20; this.food=this.spawn(); sfx('eat');
      this.step=Math.max(0.09, this.step*0.98);
      const idx = S.level-1;
      if(idx < this.levelThresholds.length && S.score >= this.levelThresholds[idx]){
        S.level++;
        this.spawnObstacles((S.level-1)*4);
        return levelUp('LEVEL UP');
      }
    } else this.body.pop();
  },
  draw(){
    for(const o of this.obstacles) cellBlock(o.c, o.r, COL.dim, COL.grid);
    cellBlock(this.food.c, this.food.r, COL.orange, '#ffd77a');
    this.body.forEach((b,i)=>
      cellBlock(b.c,b.r, i===0?COL.hi:COL.block, i===0?COL.white:COL.hi));
  }
};

/* =========================================================
   GAME 5 — TETRIS
   ========================================================= */
const SHAPES = {
  I:[[0,1],[1,1],[2,1],[3,1]], O:[[0,0],[1,0],[0,1],[1,1]],
  T:[[0,1],[1,1],[2,1],[1,0]], S:[[1,0],[2,0],[0,1],[1,1]],
  Z:[[0,0],[1,0],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]],
  L:[[2,0],[0,1],[1,1],[2,1]]
};
const Tetris = {
  title:'TETRIS',
  init(){
    this.grid = Array.from({length:ROWS},()=>Array(COLS).fill(null));
    this.fall = 0.6; this.t = 0;
    this.levelLines = 0;              // total line clears toward the next level-up
    this.spawnPiece();
  },
  addGarbageRow(){
    this.grid.shift();
    const gap = (Math.random()*COLS)|0;
    this.grid.push(Array.from({length:COLS},(_,c)=>c===gap?null:COL.dim));
  },
  spawnPiece(){
    const keys=Object.keys(SHAPES);
    const k=keys[(Math.random()*keys.length)|0];
    this.piece = { cells:SHAPES[k].map(p=>[...p]), c:(COLS/2|0)-2, r:0 };
    if(this.hits(this.piece.cells, this.piece.c, this.piece.r)) gameOver('STACK OVERFLOW');
  },
  hits(cells,oc,or){
    return cells.some(([x,y])=>{
      const cc=oc+x, rr=or+y;
      return cc<0 || cc>=COLS || rr>=ROWS || (rr>=0 && this.grid[rr][cc]);
    });
  },
  rotate(){
    sfx('rotate');
    const p=this.piece;
    const rot=p.cells.map(([x,y])=>[-y,x]);
    const minX=Math.min(...rot.map(q=>q[0])), minY=Math.min(...rot.map(q=>q[1]));
    const norm=rot.map(([x,y])=>[x-minX,y-minY]);
    for(const kick of [0,-1,1,-2,2])
      if(!this.hits(norm, p.c+kick, p.r)){ p.cells=norm; p.c+=kick; return; }
  },
  press(d){
    const p=this.piece;
    if(d==='left'  && !this.hits(p.cells,p.c-1,p.r)) p.c--;
    if(d==='right' && !this.hits(p.cells,p.c+1,p.r)) p.c++;
    if(d==='up'||d==='action') this.rotate();
    if(d==='down') this.dropOne();
  },
  dropOne(){
    const p=this.piece;
    if(!this.hits(p.cells,p.c,p.r+1)){ p.r++; S.score+=1; }
    else this.lock();
  },
  lock(){
    const p=this.piece;
    p.cells.forEach(([x,y])=>{ const rr=p.r+y, cc=p.c+x; if(rr>=0) this.grid[rr][cc]=COL.block; });
    let cleared=0;
    for(let r=ROWS-1;r>=0;r--){
      if(this.grid[r].every(v=>v)){
        this.grid.splice(r,1); this.grid.unshift(Array(COLS).fill(null));
        cleared++; r++;
      }
    }
    let leveledUp = false;
    if(cleared){
      S.score += [0,100,300,600,1000][cleared];
      S.coins += cleared;
      sfx('line');
      this.fall = Math.max(0.16, this.fall*0.97);
      this.levelLines += cleared;
      if(this.levelLines >= 5){
        this.levelLines -= 5;
        S.level++;
        this.fall = Math.max(0.12, this.fall*0.85);
        this.addGarbageRow();
        leveledUp = true;
      }
    }
    this.spawnPiece();
    if(leveledUp) levelUp('LEVEL UP — GARBAGE ROW ADDED');
  },
  update(dt){
    this.t += dt;
    const speed = held.down ? this.fall/8 : this.fall;
    if(this.t >= speed){ this.t = 0; this.dropOne(); }
  },
  draw(){
    for(let r=0;r<ROWS;r++) for(let k=0;k<COLS;k++)
      if(this.grid[r][k]) cellBlock(k,r,this.grid[r][k]);
    const p=this.piece;
    p.cells.forEach(([x,y])=>{ if(p.r+y>=0) cellBlock(p.c+x, p.r+y, COL.hi, COL.white); });
  }
};

/* =========================================================
   GAME 6 — FROGGER
   Frog hops one grid cell per press (grid-locked, like the turret
   model above). Traffic lanes are chains of moving blocks tracked in
   continuous cell units; collision is a plain AABB overlap against the
   frog's integer cell — same "resolve on grid indices" spirit as the
   Brick Shooter fix.
   ========================================================= */
const Frogger = {
  title:'FROGGER',
  init(){
    this.startRow = ROWS-1;
    this.homeRow = 0;
    this.frog = { c: COLS>>1, r: this.startRow };
    this.bestRow = this.startRow;
    this.lanes = this.buildLanes();
  },
  // traffic keeps flowing; only the frog goes back to the kerb
  respawn(){
    this.frog = { c: COLS>>1, r: this.startRow };
    this.bestRow = this.startRow;
  },
  buildLanes(){
    const lvl = Math.min(S.level,5);
    const laneRows = [2,3,4,6,7,8,10,11,12,14,15,16];
    return laneRows.map((row,i)=>{
      const dir = (i%2===0) ? 1 : -1;
      const speed = (1.6 + (i%4)*0.35) * (1+(lvl-1)*0.18);   // faster traffic each level
      const spacing = Math.max(2.5, (4+(i%3)) - (lvl-1)*0.4); // denser traffic each level
      const count = Math.ceil(COLS/spacing)+1;
      const cars = [];
      for(let k=0;k<count;k++) cars.push(k*spacing + (i*1.3)%spacing);
      return { row, dir, speed, spacing, count, cars };
    });
  },
  press(d){
    const f=this.frog;
    let c=f.c, r=f.r;
    if(d==='left')  c--;
    if(d==='right') c++;
    if(d==='up')    r--;
    if(d==='down')  r++;
    if(c<0||c>=COLS||r<0||r>=ROWS) return;
    f.c=c; f.r=r;
    if(r<this.bestRow){ S.score += (this.bestRow-r)*10; S.coins += 1; this.bestRow=r; }
    if(r===this.homeRow){
      S.level++;
      this.frog = { c: COLS>>1, r: this.startRow };
      this.bestRow = this.startRow;
      this.lanes = this.buildLanes();
      return levelUp('REACHED HOME');
    }
  },
  update(dt){
    for(const lane of this.lanes){
      const span = lane.spacing*lane.count;
      for(let i=0;i<lane.cars.length;i++){
        lane.cars[i] += lane.dir*lane.speed*dt;
        if(lane.dir>0 && lane.cars[i] > COLS+1)        lane.cars[i] -= span;
        if(lane.dir<0 && lane.cars[i] < -lane.spacing-1) lane.cars[i] += span;
      }
    }
    const f=this.frog;
    for(const lane of this.lanes){
      if(lane.row!==f.r) continue;
      for(const x of lane.cars)
        if(x < f.c+1 && x+1 > f.c) return gameOver('HIT BY TRAFFIC');
    }
  },
  draw(){
    // yellow reads as "you" across the whole arcade (the Breakout ball,
    // Snake's food), so the frog is yellow and the traffic uses the
    // standard blue block + light outline every other game uses
    pxRect(0, this.homeRow*CELL, W, CELL, 'rgba(251,191,36,.15)');
    for(const lane of this.lanes){
      pxRect(0, lane.row*CELL, W, CELL, 'rgba(255,255,255,.03)');
      for(const x of lane.cars)
        if(x > -1.5 && x < COLS+1.5) cellBlock(x, lane.row, COL.block, COL.hi);
    }
    ctx.save();
    ctx.shadowColor='rgba(251,191,36,.7)'; ctx.shadowBlur=CELL*0.45;
    cellBlock(this.frog.c, this.frog.r, COL.yellow, '#FDE08A');
    ctx.restore();
  }
};

   FLOW
   ========================================================= */
const CATALOG = [
  {key:'breakout',    game:Breakout,    short:'BREAKOUT'},
  {key:'snake',       game:Snake,       short:'SNAKE & BALL'},
  {key:'brickshooter',game:BrickShooter,short:'BRICK SHOOTER'},
  {key:'pacman',      game:PacMan,      short:'PAC MAN'},
  {key:'tetris',      game:Tetris,      short:'TETRIS'},
  {key:'frogger',     game:Frogger,     short:'FROGGER'}
];

function openMenu(){
  S.screen='menu'; S.paused=false; S.over=false;
  S.coins=0; S.score=0; S.time=0; S.level=1;
  S.livesApply=true; S.lives=MAX_LIVES; hud();   // decorative on the menu, per the mock
  G = Menu; Menu.init();
  el.title.textContent='BASE ARCADE';
  el.pause.disabled=true; el.cont.disabled=false;   // CONTINUE starts the game
  document.getElementById('gameLabel').classList.add('show');
  hideOverlay();
}
function start(key){
  const entry = CATALOG.find(g=>g.key===key);
  G = entry.game;
  S.screen='play'; S.key=key; S.paused=false; S.over=false;
  S.coins=0; S.score=0; S.time=0; S.level=1;
  S.livesApply = !!LIVES_GAMES[key];
  S.lives = S.livesApply ? MAX_LIVES : 0;
  el.title.textContent = G.title;
  el.pause.disabled=false; el.cont.disabled=false;
  document.getElementById('gameLabel').classList.remove('show');
  fitCanvas(); G.init(); hud(); hideOverlay();
}
function gameOver(reason){
  if(S.over) return;
  // in the four games that use lives, a death costs a heart and drops you
  // back into the same level with your score intact
  if(S.livesApply && S.lives > 1){
    S.lives--;
    S.paused = true;
    hud();
    sfx('life');
    showOverlay('LIFE LOST', `${reason}<br><br>${S.lives} ${S.lives===1?'LIFE':'LIVES'} LEFT`, [
      {label:'CONTINUE', onClick:()=>{
        if(G && G.respawn) G.respawn(); else if(G && G.initLevel) G.initLevel(); else G.init();
        S.paused = false; hideOverlay();
      }}
    ]);
    return;
  }
  if(S.livesApply) S.lives = 0;
  S.over = true;
  hud();
  sfx('over');
  const rank = submitScore(S.key, S.score);
  showOverlay('GAME OVER',
    `${reason}<br><br>LEVEL ${S.level}<br>SCORE ${S.score}<br>COINS ${S.coins}<br>TIME ${fmtTime(S.time)}` +
    (rank ? `<br><br>NEW BEST — RANK ${rank}` : ''),
    [{label:'PLAY AGAIN', onClick:()=>start(S.key)},
     {label:'SCORES', ghost:true, onClick:openLeaderboard},
     {label:'MENU', ghost:true, onClick:openMenu}]);
}
// called by a game once its level objective is cleared — pauses briefly on a
// "LEVEL UP" card (score/coins carry over) then resumes with harder params
// already rebuilt by the caller. Levels are uncapped; each game clamps its own
// difficulty lookup at level 5 so play continues at max difficulty forever.
function levelUp(reason){
  if(S.over) return;
  S.paused = true;
  sfx('level');
  showOverlay(`LEVEL ${S.level}`, reason, [
    {label:'CONTINUE', onClick:()=>{ S.paused=false; hideOverlay(); }}
  ]);
}
function pause(){
  if(S.screen!=='play' || S.over) return;
  S.paused = true;
  showOverlay('PAUSED', `LEVEL ${S.level}`, [
    {label:'RESUME',  onClick:resume},
    {label:'RESTART', ghost:true, onClick:()=>start(S.key)},
    {label:'MENU',    ghost:true, onClick:openMenu}
  ]);
}
function resume(){
  if(S.screen!=='play' || S.over) return;
  S.paused=false; hideOverlay();
}
el.pause.onclick = pause;
el.cont.onclick  = () => {                       // CONTINUE: starts on menu, resumes in play
  if(S.screen==='menu') start(CATALOG[Menu.sel].key);
  else resume();
};
el.title.onclick = openMenu;

cv.addEventListener('pointerdown', e=>{
  if(S.screen!=='menu') return;
  const r = cv.getBoundingClientRect();
  Menu.hit(e.clientX-r.left, e.clientY-r.top);
});

/* =========================================================
   LOOP
   ========================================================= */
let last = 0;
function frame(t){
  const dt = Math.min((t-last)/1000, 0.05);
  last = t;
  if(S.screen==='play' && !S.paused && !S.over && G){
    S.time += dt; G.update(dt); hud();
  }
  clearBoard();
  if(S.screen==='play' || S.screen==='menu') drawGrid();
  if(G && G.draw) G.draw();   // the leaderboard clears + grids itself
  requestAnimationFrame(frame);
}

buildDpad();
buildPills();
paintIcons();
setSound(soundOn);   // restores the saved preference and labels the toggle
hud();
fitCanvas();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitCanvas);
S.screen='splash'; G=null;
initSplash();
requestAnimationFrame(t=>{ last=t; frame(t); });
</script>
</body>
